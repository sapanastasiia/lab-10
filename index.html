<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №10</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin-top: 50px;
        }
        .container {
            background: white;
            width: 300px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            background: #555;
            padding: 5px;
            margin: 15px 0;
        }
        .cell {
            background: white;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #00ff00;
            border: 1px solid #00aa00;
            cursor: pointer;
            font-weight: bold;
        }
        button:disabled {
            background-color: #ddd;
            cursor: default;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="userTitle">User</h2>
        <p id="attemptText">Спроба 0 з 3</p>

        <div class="grid" id="slotGrid">
            <div class="cell">🍎</div><div class="cell">🍐</div><div class="cell">🍋</div>
            <div class="cell">🍑</div><div class="cell">🍒</div><div class="cell">🍎</div>
            <div class="cell">🍋</div><div class="cell">🍋</div><div class="cell">🍑</div>
        </div>

        <button id="genBtn" onclick="playGame()">Generate</button>
        <p id="resultText"></p>
    </div>

    <script>
        const std = {
            fruits: ["🍎", "🍐", "🍋", "🍑", "🍒"],
            max: 3,
            attempt: 0,
            win: false
        };

        let name = prompt("Введіть ваше ім'я:", "Гравець");
        if (name) {
            document.getElementById("userTitle").textContent = name;
        }

        function playGame() {
            if (std.attempt >= std.max || std.win) return;
            std.attempt++;

            let col1 = getCol();
            let col2 = getCol();
            let col3 = getCol();

            let matrix = [
                [col1[0], col2[0], col3[0]],
                [col1[1], col2[1], col3[1]],
                [col1[2], col2[2], col3[2]]
            ];

            let cells = document.querySelectorAll(".cell");
            let index = 0;
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {
                    cells[index].textContent = matrix[r][c];
                    index++;
                }
            }

            document.getElementById("attemptText").textContent = `Спроба ${std.attempt} з ${std.max}`;

            for (let r = 0; r < 3; r++) {
                if (matrix[r][0] === matrix[r][1] && matrix[r][1] === matrix[r][2]) {
                    std.win = true;
                    break;
                }
            }

            let res = document.getElementById("resultText");
            if (std.win) {
                res.textContent = "Ви виграли!";
                res.style.color = "green";
                end();
            } else if (std.attempt >= std.max) {
                res.textContent = "Гра закінчена!";
                res.style.color = "red";
                end();
            }
        }

        function getCol() {
            let col = [];
            for (let i = 0; i < 3; i++) {
                let avail = std.fruits.filter(f => !col.includes(f));
                let rand = avail[Math.floor(Math.random() * avail.length)];
                col.push(rand);
            }
            return col;
        }

        function end() {
            document.getElementById("genBtn").disabled = true;
        }
    </script>
</body>
</html>
